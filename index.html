<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charity:Water — Every Dollar Waters The World</title>
<style>
  :root {
    --bg-blue: #7CA7BC;
    --text-light: #D9E4E9;
    --text-lighter: #E7EEF1;
    --button-border: #C9CFD3;
    --white: #FFFFFF;
    --offwhite: #F4F4F4;
    --bar-grey: #C9CFD3;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--offwhite);
    overflow-x: hidden;
  }

  .hero-section {
    position: relative;
    background-color: var(--bg-blue);
    min-height: 800px;
    padding: 40px 6vw 120px;
    overflow: hidden;
  }

  /* Diagonal cut at the bottom of the blue section */
  .hero-section::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 140px;
    background: var(--offwhite);
    clip-path: polygon(0 100%, 100% 100%, 100% 0, 0 100%);
  }

  /* Header */
  .site-header {
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 2;
  }

  .logo-mark {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--white);
    flex-shrink: 0;
  }

  .logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .site-title {
    color: var(--text-lighter);
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .nav-bar-placeholder {
    margin-top: 24px;
    height: 28px;
    background-color: var(--bar-grey);
    border-radius: 6px;
    opacity: 0.6;
    position: relative;
    z-index: 2;
  }

  /* Content layout */
  .hero-content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    margin-top: 60px;
    flex-wrap: wrap;
  }

  .hero-text {
    flex: 1 1 420px;
    max-width: 560px;
  }

  .hero-text h1 {
    color: var(--text-lighter);
    font-size: 3rem;
    font-weight: 300;
    line-height: 1.2;
    margin-bottom: 28px;
  }

  .hero-text p {
    color: var(--text-light);
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 460px;
    margin-bottom: 36px;
  }

  .donate-btn {
    display: inline-block;
    padding: 18px 48px;
    background: transparent;
    border: 2px solid var(--button-border);
    border-radius: 8px;
    color: var(--text-lighter);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .donate-btn:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  .donate-btn:focus-visible {
    outline: 3px solid var(--white);
    outline-offset: 3px;
  }

  .hero-image {
    flex: 1 1 360px;
    max-width: 378px;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  }

  .hero-image img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .hero-section {
      padding: 32px 6vw 160px;
    }

    .hero-content {
      flex-direction: column;
      align-items: flex-start;
      margin-top: 40px;
    }

    .hero-text h1 {
      font-size: 2.3rem;
    }

    .hero-image {
      order: -1;
      max-width: 100%;
    }
  }

  @media (max-width: 480px) {
    .site-title {
      font-size: 1.2rem;
    }

    .hero-text h1 {
      font-size: 1.9rem;
    }

    .donate-btn {
      width: 100%;
      text-align: center;
      padding: 16px 0;
    }
  }
</style>
</head>
<body>

  <section class="hero-section">
    <header class="site-header">
      <div class="logo-mark">
        <img src="assets/logo.png" alt="Charity:Water logo">
      </div>
      <span class="site-title">Charity:Water</span>
    </header>

    <div class="nav-bar-placeholder"></div>

    <div class="hero-content">
      <div class="hero-text">
        <h1>Every Dollar Waters<br>The World</h1>
        <p>At Charity Water, 100% of your dollar is used to fund clean water projects that you can see for yourself.</p>
        <a href="#donate" class="donate-btn">Donate Today</a>
      </div>

      <div class="hero-image">
        <img src="assets/hero_photo.png" alt="Clean water project team standing with a well-drilling rig">
      </div>
    </div>
  </section>

</body>
</html>
